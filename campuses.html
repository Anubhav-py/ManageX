<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Campuses | ManageX</title>
<style>
:root{--g:#01714e;--soft:#e8f4ef;--ink:#17211e;--muted:#6b7772;--line:#dce6e2}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f8f6;color:var(--ink)}header{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}.mark{width:38px;height:38px;border-radius:11px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{font-size:10px;color:var(--muted);margin:2px 0 0}.nav{display:flex;gap:5px}.nav a{padding:9px 12px;border-radius:9px;text-decoration:none;color:#314039;font-size:12px;font-weight:700}.nav a.active{background:var(--soft);color:var(--g)}.wrap{max-width:1100px;margin:34px auto;padding:0 20px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.kicker{color:var(--g);font-weight:900;font-size:10px;letter-spacing:.13em}.head h2{font-size:32px;margin:6px 0}.head p{color:var(--muted);font-size:13px;margin:0}.btn{padding:11px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;text-decoration:none;color:#2e3c36;font-weight:800;font-size:12px}.btn.primary{background:var(--g);border-color:var(--g);color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 22px rgba(19,55,44,.06)}.thumb{height:170px;background:#eef4f1;overflow:hidden}.thumb svg{display:block;width:100%;height:100%}.body{padding:15px}.body h3{margin:0;font-size:17px}.meta{color:var(--muted);font-size:11px;margin-top:4px}.desc{color:#4b5a54;font-size:12px;line-height:1.55;margin-top:10px;min-height:38px}.actions{display:flex;gap:8px;margin-top:13px}.small{padding:9px 11px;font-size:11px}.empty{margin-top:24px;padding:40px;background:#fff;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.nav{display:none}}@media(max-width:560px){.head{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}}
</style></head><body>
<header><a class="brand" href="index.html"><div class="mark">M</div><div><h1>ManageX</h1><p>Campus map system</p></div></a><nav class="nav"><a href="index.html">Home</a><a class="active" href="campuses.html">Map</a><a href="reports.html">Reports</a><a href="dashboard.html">Dashboard</a></nav></header>
<main class="wrap"><div class="head"><div><div class="kicker">CAMPUS DIRECTORY</div><h2>Choose a Campus</h2><p>Open the interactive map for ITER or build a new campus from scratch.</p></div><a class="btn primary" href="campus-editor.html">＋ Add Campus</a></div><section id="grid" class="grid"></section><div id="empty" class="empty" hidden>No added campuses found yet.</div></main>
<script type="module">
import {auth,db} from './firebase.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import {collection,onSnapshot,query,orderBy} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
const grid=document.getElementById('grid'),empty=document.getElementById('empty');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function miniMap(c){const objs=c.objects||[];const roads=objs.filter(o=>o.type==='road').map(o=>`<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="#8a9690" stroke-width="26" stroke-linecap="round"/>`).join('');const buildings=objs.filter(o=>o.type==='building').map(o=>{const x=Math.min(o.x1,o.x2),y=Math.min(o.y1,o.y2),w=Math.abs(o.x2-o.x1),h=Math.abs(o.y2-o.y1);return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${o.color||'#cfe7dd'}" stroke="#42514a" stroke-width="2"/><rect x="${x+7}" y="${y+7}" width="${Math.max(0,w-14)}" height="${Math.max(0,h-14)}" rx="6" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2"/>`}).join('');return `<svg viewBox="0 0 1000 700" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><rect width="1000" height="700" fill="#fbfdfc"/>${roads}${buildings}</svg>`}
function dynamicCard(c){return `<article class="card"><div class="thumb">${miniMap(c)}</div><div class="body"><h3>${esc(c.name)}</h3><div class="meta">${esc(c.location||'Location not specified')}</div><div class="desc">${esc(c.description||'Interactive campus built in ManageX')}</div><div class="actions"><a class="btn small primary" href="campus.html?id=${encodeURIComponent(c.id)}">Open map</a></div></div></article>`}
const iter=`<article class="card"><div class="thumb"><img src="Map/template-map.jpeg" alt="ITER campus" style="width:100%;height:100%;object-fit:cover"></div><div class="body"><h3>ITER Campus</h3><div class="meta">Siksha 'O' Anusandhan, Bhubaneswar</div><div class="desc">Interactive ITER map with the current campus block geometry and facility workflow.</div><div class="actions"><a class="btn small primary" href="Map/index.html">Open map</a></div></div></article>`;
onAuthStateChanged(auth,user=>{if(!user){location.href='login.html';return}onSnapshot(query(collection(db,'campuses'),orderBy('createdAt','desc')),snap=>{const added=snap.docs.map(d=>({id:d.id,...d.data()}));grid.innerHTML=iter+added.map(dynamicCard).join('');empty.hidden=added.length>0;},err=>{console.error(err);grid.innerHTML=iter;empty.textContent='Unable to load added campuses. Check Firestore rules.';empty.hidden=false;});});
</script></body></html>
