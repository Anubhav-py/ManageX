<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#01714e" />
  <title>ITER Campus Management</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">I</div>
        <div>
          <div class="brand-title">ITER Campus Management</div>
          <div class="brand-subtitle">Interactive campus facilities map</div>
        </div>
      </div>
      <a href="../campuses.html" style="margin-left:auto;text-decoration:none;color:#01714e;font-size:11px;font-weight:800;border:1px solid #d8e2de;border-radius:9px;padding:8px 10px;background:#fff">All Campuses</a>
    </header>

    <main class="map-stage">
      <section class="map-card" aria-label="Interactive ITER campus map">
        <div class="map-grid" aria-hidden="true"></div>
        <div class="map-image-wrap">
<svg id="campusMap" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ITER campus interactive map">
  <defs>
    <linearGradient id="financeFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1aa578"/><stop offset="1" stop-color="#62d1ad"/></linearGradient>
    <linearGradient id="adminFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6676d8"/><stop offset="1" stop-color="#aaa0ee"/></linearGradient>
    <linearGradient id="aFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0ad3d"/><stop offset="1" stop-color="#f5d077"/></linearGradient>
    <linearGradient id="bFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e1785d"/><stop offset="1" stop-color="#f0ac87"/></linearGradient>
    <linearGradient id="bansuriFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7164c2"/><stop offset="1" stop-color="#b49ce9"/></linearGradient>
    <linearGradient id="cFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63bda7"/><stop offset="1" stop-color="#b0dfd4"/></linearGradient>
    <linearGradient id="libraryFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fa2da"/><stop offset="1" stop-color="#b7d1ee"/></linearGradient>
    <linearGradient id="dFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d97d9c"/><stop offset="1" stop-color="#efb7c8"/></linearGradient>
    <linearGradient id="scFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f72c4"/><stop offset="1" stop-color="#c8afe5"/></linearGradient>
    <linearGradient id="fFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#61b3c8"/><stop offset="1" stop-color="#a9dce6"/></linearGradient>
    <linearGradient id="eFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#45a887"/><stop offset="1" stop-color="#9bd9c5"/></linearGradient>
    <style>
      .map-block{cursor:pointer;outline:none}
      .map-block .fill{stroke:#01714e;stroke-width:4;fill-opacity:.96;pointer-events:none;vector-effect:non-scaling-stroke}
      .map-block .inner-outline{fill:none;stroke:#f8fffc;stroke-width:3;stroke-opacity:.92;pointer-events:none;vector-effect:non-scaling-stroke}
      .map-block .hit{fill:#fff;fill-opacity:0;stroke:none;pointer-events:all}
      .map-block:hover .fill,.map-block:focus .fill{stroke:#005d40;stroke-width:5;filter:drop-shadow(0 7px 12px rgba(1,113,78,.22))}
      .nonclick{pointer-events:none}
      .block-label{fill:#1c2824;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
      .block-label.small{font-size:15px}
      .block-label.tiny{font-size:12px}
      .finance-label{fill:#18342b;font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:800;text-anchor:middle}
    </style>
  </defs>

  <image x="0" y="0" width="1024" height="1024" preserveAspectRatio="none" href="template-map.jpeg" xlink:href="template-map.jpeg" />

  <g class="map-block" tabindex="0" role="button" aria-label="Finance Department" data-block="Finance Department">
    <path class="fill" d="M178 19 L116 32 L134 121 L197 108 Z" fill="url(#financeFill)"/>
    <path class="inner-outline" d="M174 31 L128 41 L142 109 L185 100 Z"/>
    <path class="hit" d="M178 19 L116 32 L134 121 L197 108 Z"/>
    <g transform="rotate(78 157 70)">
      <text class="finance-label" x="157" y="66">Finance</text>
      <text class="finance-label" x="157" y="82">Department</text>
    </g>
  </g>

  <g class="map-block" tabindex="0" role="button" aria-label="Administrative Block" data-block="Administrative Block">
    <path class="fill" d="M181 143 L292 83 L321 130 L236 158 L204 244 L170 188 Z" fill="url(#adminFill)"/>
    <path class="inner-outline" d="M185 151 L289 96 L308 127 L231 153 L201 229 L180 186 Z"/>
    <path class="hit" d="M181 143 L292 83 L321 130 L236 158 L204 244 L170 188 Z"/>
    <g transform="rotate(-30 243 145)">
      <text class="block-label small" x="243" y="142">Administrative</text>
      <text class="block-label small" x="243" y="160">Block</text>
    </g>
  </g>

  <g class="map-block" tabindex="0" role="button" aria-label="A Block" data-block="A Block">
    <path class="fill" d="M204 244 L248 218 L279 261 L232 303 Z" fill="url(#aFill)"/>
    <path class="inner-outline" d="M210 247 L246 226 L269 260 L233 294 Z"/>
    <path class="hit" d="M204 244 L248 218 L279 261 L232 303 Z"/>
    <text class="block-label small" x="241" y="263" transform="rotate(-32 241 263)">A Block</text>
  </g>

  <g class="map-block" tabindex="0" role="button" aria-label="B Block" data-block="B Block">
    <path class="fill" d="M309 142 C324 143 336 145 339 154 C346 172 350 197 347 216 C343 238 327 257 306 273 L279 261 L239 190 L240 164 Z" fill="url(#bFill)"/>
    <path class="inner-outline" d="M309 152 C322 152 331 154 332 160 C338 179 341 199 338 215 C334 233 322 248 305 263 L287 254 L250 188 L251 171 Z"/>
    <path class="hit" d="M309 142 C324 143 336 145 339 154 C346 172 350 197 347 216 C343 238 327 257 306 273 L279 261 L239 190 L240 164 Z"/>
    <text class="block-label small" x="307" y="210" transform="rotate(84 307 210)">B Block</text>
  </g>

  <g class="nonclick" aria-label="Football field">
    <image x="0" y="0" width="1024" height="1024" preserveAspectRatio="none" href="futsal-field-fitted.png" xlink:href="futsal-field-fitted.png"/>
    <polygon points="404,214 543,262 507,362 368,311" fill="none" stroke="#01714e" stroke-width="3.5" vector-effect="non-scaling-stroke"/>
  </g>

  <g class="map-block" tabindex="0" role="button" aria-label="Bansuri Bhawan" data-block="Bansuri Bhawan">
    <path class="fill" d="M600 171 L664 188 L613 386 L550 369 Z" fill="url(#bansuriFill)"/>
    <path class="inner-outline" d="M608 182 L653 194 L606 374 L560 362 Z"/>
    <path class="hit" d="M600 171 L664 188 L613 386 L550 369 Z"/>
    <text class="block-label small" x="607" y="285" transform="rotate(104 607 285)">Bansuri Bhawan</text>
  </g>

  <g class="map-block" tabindex="0" role="button" aria-label="C Block" data-block="C Block">
    <path class="fill" d="M294 352 L617 415 L600 510 L276 448 Z" fill="url(#cFill)"/>
    <path class="inner-outline" d="M306 365 L602 423 L588 497 L290 440 Z"/>
    <path class="hit" d="M294 352 L617 415 L600 510 L276 448 Z"/>
    <text class="block-label" x="454" y="429" transform="rotate(11 454 429)">C Block</text>
  </g>

  <g class="map-block" tabindex="0" role="button" aria-label="Library" data-block="Library">
    <path class="fill" d="M168 514 L50 556 L124 755 L238 711 Z" fill="url(#libraryFill)"/>
    <path class="inner-outline" d="M160 531 L65 566 L130 740 L225 704 Z"/>
    <path class="hit" d="M168 514 L50 556 L124 755 L238 711 Z"/>
    <text class="block-label" x="147" y="633" transform="rotate(-20 147 633)">Library</text>
  </g>

  <g class="map-block" tabindex="0" role="button" aria-label="D Block" data-block="D Block">
    <path class="fill" d="M249 509 L350 509 L350 685 L249 685 Z" fill="url(#dFill)"/>
    <path class="inner-outline" d="M260 520 L339 520 L339 674 L260 674 Z"/>
    <path class="hit" d="M249 509 L350 509 L350 685 L249 685 Z"/>
    <text class="block-label" x="300" y="597">D Block</text>
  </g>

  <g class="map-block" tabindex="0" role="button" aria-label="SC Block" data-block="SC Block">
    <path class="fill" d="M438 522 L571 544 L560 620 L428 598 Z" fill="url(#scFill)"/>
    <path class="inner-outline" d="M448 532 L558 550 L550 610 L438 591 Z"/>
    <path class="hit" d="M438 522 L571 544 L560 620 L428 598 Z"/>
    <text class="block-label small" x="499" y="575" transform="rotate(9 499 575)">SC Block</text>
  </g>

  <g class="map-block" tabindex="0" role="button" aria-label="F Block" data-block="F Block">
    <path class="fill" d="M637 510 L762 510 L761 659 L638 659 Z" fill="url(#fFill)"/>
    <path class="inner-outline" d="M648 520 L751 520 L750 649 L648 649 Z"/>
    <path class="hit" d="M637 510 L762 510 L761 659 L638 659 Z"/>
    <text class="block-label" x="700" y="583">F Block</text>
  </g>

  <g class="map-block" tabindex="0" role="button" aria-label="E Block" data-block="E Block">
    <path class="fill" d="M421 628 L760 760 L692 949 L346 815 Z" fill="url(#eFill)"/>
    <path class="inner-outline" d="M435 644 L745 765 L684 932 L362 808 Z"/>
    <path class="hit" d="M421 628 L760 760 L692 949 L346 815 Z"/>
    <text class="block-label" x="548" y="804" transform="rotate(22 548 804)">E Block</text>
  </g>

  <g class="nonclick" aria-label="Food Court">
    <path d="M954 570 L803 622 L821 671 L969 618 Z" fill="#c89a62" fill-opacity=".94" stroke="#816044" stroke-width="3"/>
    <path d="M935 585 L817 626 L829 657 L955 613 Z" fill="none" stroke="#f7ead9" stroke-width="2.2" opacity=".95"/>
    <text class="block-label tiny" x="888" y="622" transform="rotate(-19 888 622)">Food Court</text>
  </g>
</svg>
        </div>

        <div class="map-controls" aria-label="Map controls">
          <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
          <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
          <button id="resetView" type="button" aria-label="Reset map view">↺</button>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
