<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MaintainX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-card">

            <div class="login-logo">
                <div class="login-logo-icon">
                    <i class="fa-solid fa-gear"></i>
                </div>

                <div>
                    <h1>Maintain<span>X</span></h1>
                    <p>Smart Maintenance</p>
                </div>
            </div>

            <div class="login-heading">
                <h2>Welcome Back</h2>
                <p>Login to continue to MaintainX</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>

                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#">Forgot password?</a>
                </div>

                <p id="loginError" class="login-error"></p>

                <button type="submit" class="submit-login">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="google-login" type="button">
                <i class="fa-brands fa-google"></i>
                Continue with Google
            </button>

            <p class="signup-text">
                Don't have an account?
                <a href="signup.html" id="signupLink">Create an account</a>
            </p>

            <a href="index.html" class="back-home">
                <i class="fa-solid fa-arrow-left"></i>
                Back to home
            </a>

        </div>

    </div>

    <script type="module" src="auth.js"></script>

</body>
</html>
