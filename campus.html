<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Campus Map | ManageX</title>
<style>
:root{--g:#01714e;--ink:#17211d;--muted:#6b7772;--line:#d9e5df}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eef4f1;color:var(--ink);overflow:hidden}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 22px}.brand{display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;background:var(--g);border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:900}.title{font-weight:900;font-size:15px}.sub{font-size:10px;color:var(--muted)}.back{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;color:#2e3b35;text-decoration:none;font-size:11px;font-weight:800}.stage{height:calc(100vh - 64px);display:grid;place-items:center;padding:18px}.map-card{position:relative;width:min(1180px,94vw,calc(100vh - 98px)*1.42);aspect-ratio:10/7;background:#fff;border:1px solid #d6e1dc;border-radius:18px;overflow:hidden;box-shadow:0 20px 55px rgba(20,55,45,.12)}.canvas{position:absolute;inset:16px;border-radius:12px;overflow:hidden;background:#fbfdfc;background-image:linear-gradient(#edf2ef 1px,transparent 1px),linear-gradient(90deg,#edf2ef 1px,transparent 1px);background-size:25px 25px}.canvas svg{position:absolute;inset:0;width:100%;height:100%}.road{stroke:#8a9690;stroke-linecap:round}.road.edge{stroke:#68736e}.building{cursor:pointer}.building .shape{stroke:#42514a;stroke-width:1.8}.building:hover .shape{stroke:#01714e;stroke-width:3}.building text{font-size:16px;font-weight:900;fill:#202925;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.building .inner{fill:none;stroke:rgba(255,255,255,.84);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}.notice{position:absolute;left:26px;top:24px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:10px;color:var(--muted);z-index:2}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#fbfdfc;color:var(--muted);z-index:3}.modal{position:fixed;inset:0;background:rgba(12,29,23,.48);backdrop-filter:blur(7px);display:grid;place-items:center;padding:18px;opacity:0;visibility:hidden;transition:.2s;z-index:10}.modal.open{opacity:1;visibility:visible}.dialog{width:min(680px,calc(100vw - 28px));max-height:calc(100vh - 36px);overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.23)}.dh{padding:22px 24px;border-bottom:1px solid #e5eee9;display:flex;justify-content:space-between}.dh h2{font-size:24px;margin:5px 0}.dh p{margin:0;color:var(--muted);font-size:11px}.close{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#f8fbf9;cursor:pointer;font-size:18px}.db{padding:20px 24px}.section{margin-bottom:18px}.section h3{font-size:11px;margin:0 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.act{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfdfc}.floor{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.floor button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 5px;font-weight:800;cursor:pointer}.floor button:hover{border-color:#86b7a3;background:#f1faf6}.wash{display:none}.wash.show{display:grid}.wash a{padding:14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink)}
@media(max-width:700px){body{overflow:auto}.stage{height:auto;min-height:calc(100vh - 64px)}.map-card{width:94vw}.grid{grid-template-columns:1fr}.floor{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header class="top"><div class="brand"><div class="mark">M</div><div><div id="campusTitle" class="title">Campus Map</div><div class="sub">Interactive facilities map</div></div></div><a class="back" href="campuses.html">← All Campuses</a></header>
<main class="stage"><section class="map-card"><div class="canvas" id="canvas"><div class="loading" id="loading">Loading campus…</div></div><div class="notice">Click a building to open facility management.</div></section></main>
<div class="modal" id="modal"><div class="dialog"><div class="dh"><div><div style="font-size:10px;font-weight:900;letter-spacing:.12em;color:#01714e">FACILITY MANAGEMENT</div><h2 id="modalTitle">Building</h2><p>Select a lift or floor to continue.</p></div><button id="close" class="close">×</button></div><div class="db"><section class="section"><h3>Lifts</h3><div class="grid"><a class="act" href="#" onclick="return false">Lift 1 <b>→</b></a><a class="act" href="#" onclick="return false">Lift 2 <b>→</b></a></div></section><section class="section"><h3>Floors</h3><div class="floor" id="floorGrid"></div></section><section class="section"><h3 id="floorTitle">Washrooms</h3><div class="grid wash" id="washrooms"><a href="#" onclick="return false">♂ Male Washroom</a><a href="#" onclick="return false">♀ Female Washroom</a></div></section></div></div></div>
<script type="module">
import {auth,db} from './firebase.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import {doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
const id=new URLSearchParams(location.search).get('id'),canvas=document.getElementById('canvas'),loading=document.getElementById('loading'),modal=document.getElementById('modal'),title=document.getElementById('modalTitle'),floorGrid=document.getElementById('floorGrid'),wash=document.getElementById('washrooms'),floorTitle=document.getElementById('floorTitle');let selected='';
function openArea(name){selected=name;title.textContent=name;floorGrid.innerHTML=[['G','Ground'],['1','Floor 1'],['2','Floor 2'],['3','Floor 3'],['4','Floor 4'],['5','Floor 5']].map(x=>`<button type="button" data-floor="${x[0]}"><b>${x[0]}</b><br><small>${x[1]}</small></button>`).join('');wash.classList.remove('show');modal.classList.add('open');floorGrid.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{floorTitle.textContent=`${selected} · ${b.dataset.floor==='G'?'Ground':'Floor '+b.dataset.floor}`;wash.classList.add('show')}));}
function render(c){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 1000 700');svg.setAttribute('preserveAspectRatio','none');(c.objects||[]).filter(o=>o.type==='road').forEach(o=>{const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.classList.add('road');l.setAttribute('x1',o.x1);l.setAttribute('y1',o.y1);l.setAttribute('x2',o.x2);l.setAttribute('y2',o.y2);l.setAttribute('stroke-width',o.width||26);svg.appendChild(l)});(c.objects||[]).filter(o=>o.type==='building').forEach(o=>{const r={x:Math.min(o.x1,o.x2),y:Math.min(o.y1,o.y2),w:Math.abs(o.x2-o.x1),h:Math.abs(o.y2-o.y1)};const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.classList.add('building');const base=document.createElementNS('http://www.w3.org/2000/svg','rect');base.classList.add('shape');base.setAttribute('x',r.x);base.setAttribute('y',r.y);base.setAttribute('width',r.w);base.setAttribute('height',r.h);base.setAttribute('rx',o.radius||10);base.setAttribute('fill',o.color||'#cfe7dd');g.appendChild(base);const inner=document.createElementNS('http://www.w3.org/2000/svg','rect');inner.classList.add('inner');inner.setAttribute('x',r.x+7);inner.setAttribute('y',r.y+7);inner.setAttribute('width',Math.max(0,r.w-14));inner.setAttribute('height',Math.max(0,r.h-14));inner.setAttribute('rx',Math.max(2,(o.radius||10)-4));g.appendChild(inner);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',r.x+r.w/2);t.setAttribute('y',r.y+r.h/2);t.textContent=o.name;g.appendChild(t);g.addEventListener('click',()=>openArea(o.name));svg.appendChild(g)});canvas.innerHTML='';canvas.appendChild(svg)}
onAuthStateChanged(auth,async user=>{if(!user){location.href='login.html';return}if(!id){loading.textContent='Campus not found.';return}try{const snap=await getDoc(doc(db,'campuses',id));if(!snap.exists()){loading.textContent='Campus not found.';return}const c=snap.data();document.getElementById('campusTitle').textContent=c.name;render(c)}catch(e){console.error(e);loading.textContent='Unable to load campus.'}});
document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
</script></body></html>
